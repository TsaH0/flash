[workspace]
resolver = "3"
members = ["crates/flash-core", "apps/flash"]
# Vendored dependencies are patches, not workspace members.
exclude = ["vendor", "crates/flash-core/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
flash-core = { path = "crates/flash-core" }
# Pinned exactly: Text's line model and validation are written against this
# version's behaviour (docs/PLAN.md section 2.3).
crop = { version = "=0.4.3", features = ["graphemes"] }
unicode-segmentation = "1.13"
compact_str = "0.9"
smallvec = "1.15"
slotmap = "1"
unicode-width = "0.2"
crossterm = "0.29"
arbitrary = "1"
proptest = "1.12"
criterion = "0.8"

[patch.crates-io]
# crop 0.4.3 plus one method, `Rope::chunk_at_byte` (O(log n), no allocation),
# used by Text's grapheme queries. The full diff against the published crate
# is vendor/crop-chunk-at-byte.patch (DECISIONS 008).
crop = { path = "vendor/crop" }

[profile.bench]
debug = true
