[workspace]
resolver = "3"
members = ["crates/flash-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
# Pinned exactly: Text's line model and validation are written against this
# version's behaviour (docs/PLAN.md section 2.3).
crop = { version = "=0.4.3", features = ["graphemes"] }
