[package]
name = "flash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# The binary's logic, as a library so tests and the skeleton benchmark can
# drive it without a terminal.
name = "flash_app"
path = "src/lib.rs"

[dependencies]
flash-core.workspace = true
flash-term.workspace = true
crossterm.workspace = true
# SIGTSTP/SIGCONT/SIGTERM/SIGHUP/SIGINT handling (already in the tree
# through crossterm).
signal-hook.workspace = true
# poll(2) and a wake pipe for the main-thread input experiment
# (DECISIONS 045); already in the tree for the pty tests.
rustix = { workspace = true, features = ["event", "pipe"] }

[dev-dependencies]
tempfile.workspace = true
# Pseudo-terminals for the terminal-restore smoke tests.
rustix.workspace = true

[[bench]]
name = "editor"
harness = false
