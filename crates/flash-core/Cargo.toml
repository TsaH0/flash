[package]
name = "flash-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Flash editing core: text storage, editing algebra, documents, history"

[features]
# Exposes `flash_core::internals` (raw Text mutators) for benchmarks only.
# Editor code must never enable this: document text changes go through
# transactions (docs/PLAN.md 2.2, 2.6).
internals = []
# Forwards crop's UTF-16 metric so its overhead can be measured (PLAN 2.3).
utf16 = ["crop/utf16-metric"]
# Test-only: tiny rope leaves so small inputs build multi-leaf trees and
# exercise chunk-boundary code paths.
small-chunks = ["crop/small_chunks"]
# Exposes `flash_core::fuzzing` for the cargo-fuzz crate in `fuzz/`.
fuzzing = ["dep:arbitrary"]

[dependencies]
crop.workspace = true
# Used directly because crop's own grapheme-boundary check is O(document):
# see Text::is_grapheme_boundary.
unicode-segmentation.workspace = true
# Inline (heap-free) storage for short inserted strings in ChangeSet ops.
compact_str.workspace = true
# Inline storage for the common single-range selection.
smallvec.workspace = true
arbitrary = { workspace = true, optional = true }

[dev-dependencies]
# The fuzz entry point is also driven by a stable test (src/fuzzing.rs).
arbitrary.workspace = true
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "text"
harness = false
required-features = ["internals"]

[[bench]]
name = "changeset"
harness = false
required-features = ["internals"]

[[bench]]
name = "latency"
harness = false
required-features = ["internals"]
