# Flash's default configuration: the default keymap (PLAN 2.11).
#
# This file is applied through the same code as a user's config file, into
# the default layer. A user's config (~/.config/flash/config.toml) overrides
# any binding here, or unbinds it with `false`. Notation: `x`, `C-s` (Ctrl),
# `A-z` (Alt), `S-left` (Shift, not for characters: write `U`), named keys
# `ret esc tab backspace del left right up down home end pageup pagedown
# space minus F1`..`F12`, sequences separated by spaces (`g g`). A value is
# a command name, optionally followed by its argument.
#
# Normal mode is selection-first (PLAN 2.5): the cursor is a one-grapheme
# selection, motions move it, and operators act on the selections.

[keys.normal]
h = "move-left"
j = "move-down"
k = "move-up"
l = "move-right"
left = "move-left"
down = "move-down"
up = "move-up"
right = "move-right"
w = "select-next-word"
b = "select-previous-word"
"C-left" = "move-word-left"
"C-right" = "move-word-right"
"g h" = "move-line-start"
"g l" = "move-line-end"
"g g" = "move-document-start"
"g e" = "move-document-end"
home = "move-line-start"
end = "move-line-end"
"C-home" = "move-document-start"
"C-end" = "move-document-end"
pageup = "move-page-up"
pagedown = "move-page-down"
x = "select-line"
"%" = "select-all"
i = "insert-mode"
a = "append-mode"
I = "insert-line-start"
A = "append-line-end"
o = "open-below"
O = "open-above"
v = "extend-mode"
d = "delete-selection"
c = "change-selection"
y = "copy"
p = "paste-after"
P = "paste-before"
u = "undo"
U = "redo"
";" = "collapse"
"," = "keep-primary"
esc = "collapse"
C = "add-cursor-below"
"A-C" = "add-cursor-above"
s = "select-regex"
S = "split-regex"
"A-s" = "split-lines"
K = "keep-matching"
"A-K" = "remove-matching"
"(" = "rotate-primary-backward"
")" = "rotate-primary-forward"
"A-down" = "add-cursor-below"
"A-up" = "add-cursor-above"
":" = "command-line"
"1" = "count 1"
"2" = "count 2"
"3" = "count 3"
"4" = "count 4"
"5" = "count 5"
"6" = "count 6"
"7" = "count 7"
"8" = "count 8"
"9" = "count 9"
"0" = "count 0"
"A-z" = "undo"
"A-y" = "redo"
"A-Z" = "redo"
"C-s" = "save"
"C-o" = "open"
"C-w" = "close-view"
"C-q" = "quit"
"C-z" = "suspend"
"C-c" = "copy"
"C-x" = "cut"
"C-v" = "paste-after"
"C-pageup" = "previous-view"
"C-pagedown" = "next-view"

# Extend mode: the same motions, but they extend each selection.
[keys.extend]
h = "move-left"
j = "move-down"
k = "move-up"
l = "move-right"
left = "move-left"
down = "move-down"
up = "move-up"
right = "move-right"
w = "extend-word-right"
b = "extend-word-left"
"g h" = "move-line-start"
"g l" = "move-line-end"
"g g" = "move-document-start"
"g e" = "move-document-end"
home = "move-line-start"
end = "move-line-end"
pageup = "move-page-up"
pagedown = "move-page-down"
x = "select-line"
"%" = "select-all"
v = "normal-mode"
esc = "normal-mode"
d = "delete-selection"
c = "change-selection"
y = "copy"
p = "paste-after"
P = "paste-before"
";" = "collapse"
"," = "keep-primary"
":" = "command-line"
s = "select-regex"
S = "split-regex"
"A-s" = "split-lines"
K = "keep-matching"
"A-K" = "remove-matching"
"(" = "rotate-primary-backward"
")" = "rotate-primary-forward"
"1" = "count 1"
"2" = "count 2"
"3" = "count 3"
"4" = "count 4"
"5" = "count 5"
"6" = "count 6"
"7" = "count 7"
"8" = "count 8"
"9" = "count 9"
"0" = "count 0"
"C-s" = "save"
"C-q" = "quit"
"C-z" = "suspend"

# Insert mode: unbound printable keys are typed. These are the Stage 6 keys.
[keys.insert]
esc = "normal-mode"
ret = "insert-newline"
tab = "insert-tab"
backspace = "delete-backward"
del = "delete-forward"
left = "move-left"
right = "move-right"
up = "move-up"
down = "move-down"
"S-left" = "extend-left"
"S-right" = "extend-right"
"S-up" = "extend-up"
"S-down" = "extend-down"
"C-left" = "move-word-left"
"C-right" = "move-word-right"
"C-S-left" = "extend-word-left"
"C-S-right" = "extend-word-right"
home = "move-line-start"
end = "move-line-end"
"S-home" = "extend-line-start"
"S-end" = "extend-line-end"
"C-home" = "move-document-start"
"C-end" = "move-document-end"
"C-S-home" = "extend-document-start"
"C-S-end" = "extend-document-end"
pageup = "move-page-up"
pagedown = "move-page-down"
"S-pageup" = "extend-page-up"
"S-pagedown" = "extend-page-down"
"A-up" = "add-cursor-above"
"A-down" = "add-cursor-below"
"A-z" = "undo"
"A-y" = "redo"
"A-Z" = "redo"
"C-s" = "save"
"C-o" = "open"
"C-w" = "close-view"
"C-q" = "quit"
"C-z" = "suspend"
"C-c" = "copy"
"C-x" = "cut"
"C-v" = "paste"
"C-pageup" = "previous-view"
"C-pagedown" = "next-view"

# The one-line prompt (file names, the command line): unbound printable
# keys are typed into it.
[keys.prompt]
ret = "prompt-accept"
esc = "prompt-cancel"
backspace = "prompt-backspace"
del = "prompt-delete"
left = "prompt-left"
right = "prompt-right"
home = "prompt-home"
end = "prompt-end"

# A yes/no question.
[keys.question]
y = "prompt-yes"
Y = "prompt-yes"
n = "prompt-no"
N = "prompt-no"
esc = "prompt-no"
"C-q" = "prompt-yes"
